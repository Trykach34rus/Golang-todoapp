services:
  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile

    container_name: todoapp

    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT}

      POSTGRES_HOST: todoapp-postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT}

      LOGGER_LEVEL: ${LOGGER_LEVEL}
      TIME_ZONE: ${TIME_ZONE}
      LOGGER_FOLDER: /app/out/logs

    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs

    ports:
      - '5050:5050'

    depends_on:
      - todoapp-postgres

    restart: always

    networks:
      - todoapp-network

  todoapp-postgres:
    image: postgres:18.4-bookworm

    container_name: todoapp-env-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./out/pgdata:/var/lib/postgresql

    restart: always

    networks:
      - todoapp-network

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1

    volumes:
      - ./migrations:/migrations

    depends_on:
      - todoapp-postgres

    networks:
      - todoapp-network

  port-forwarder:
    image: alpine/socat:1.8.1.1

    container_name: todoapp-postgres-port-forwarder

    command:
      - tcp-listen:5432,fork,reuseaddr
      - tcp-connect:todoapp-postgres:5432

    ports:
      - '0.0.0.0:5433:5432'

    depends_on:
      - todoapp-postgres

    networks:
      - todoapp-network

  swagger:
    build:
      context: ${PROJECT_ROOT}

      dockerfile_inline: |
        FROM golang:1.25.4-alpine

        RUN apk add --no-cache git

        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6

        WORKDIR /code

        ENTRYPOINT ["swag"]

    volumes:
      - ${PROJECT_ROOT}:/code

    networks:
      - todoapp-network

networks:
  todoapp-network:
    name: todoapp-network
    driver: bridge
