        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      description:
        example: Описание
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Название
        type: string
      version:
        example: 13
        type: integer
    type: object
  tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        example: 1
        type: integer
      completed:
        example: true
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      description:
        example: Описание
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Название
        type: string
      version:
        example: 13
        type: integer
    type: object
  tasks_transport_http.PatchTaskRequest:
    properties:
      completed:
        example: true
        type: boolean
      description:
        example: Очень подробное описание что нужно по тренировать
        type: string
      title:
        example: Сходить в зал
        type: string
    type: object
  tasks_transport_http.PatchTaskResponse:
    properties:
      author_user_id:
        example: 1
        type: integer
      completed:
        example: true
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      description:
        example: Описание
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Название
        type: string
      version:
        example: 13
        type: integer
    type: object
  tasks_transport_http.TaskDTOResponse:
    properties:
      author_user_id:
        example: 1
        type: integer
      completed:
        example: true
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      description:
        example: Описание
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Название
        type: string
      version:
        example: 13
        type: integer
    type: object
  users_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: Ivan Ivanov
        maxLength: 100
        minLength: 3
