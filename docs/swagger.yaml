        example: 30
        type: integer
      tasks_completed_rate:
        example: 20
        type: number
      tasks_created:
        example: 10
        type: integer
    type: object
  tasks_transport_http.CreateTaskRequest:
    properties:
      author_user_id:
        example: 1
        type: integer
