basePath: /api/v1
definitions:
  core_http_response.ErrorResponse:
    properties:
      error:
        example: error text
        type: string
      message:
        example: readable error message
        type: string
    type: object
  statistics_tansport_http.GetStatisticsResponse:
    properties:
      tasks_avarage_completion_time:
        example: 1m30s
        type: string
